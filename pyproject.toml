[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-osint"
version = "0.1.0"
description = "Evidence-First OSINT Orchestration Engine for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "networkx>=3.2.1",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pyyaml>=6.0.1",
    "anyio>=4.3.0"
]

[project.scripts]
spider = "spider.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]