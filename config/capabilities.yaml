version: "1.0"
capabilities:
  PUBLIC_PROFILE_LOOKUP:
    description: "Public profile metadata; exact public email evidence or username candidates"
    default_providers: ["github_public"]
    input_types: ["EMAIL", "USERNAME"]
    output_types: ["ACCOUNT", "URL", "USERNAME"]

  EMAIL_PUBLIC_PROFILE_LOOKUP:
    description: "Public profile metadata directly linked to a derived email identifier"
    default_providers: ["gravatar_public"]
    input_types: ["EMAIL"]
    output_types: ["ACCOUNT", "URL"]

  DNS_ENUMERATION:
    description: "Native forward and reverse DNS enumeration (A, AAAA, MX, NS, TXT, SOA, PTR)"
    default_providers: ["native_dns"]
    input_types: ["DOMAIN", "HOSTNAME", "EMAIL", "IP_ADDRESS"]
    output_types: ["DOMAIN", "HOSTNAME", "IP_ADDRESS", "IPV6_ADDRESS"]

  MAIL_INFRASTRUCTURE:
    description: "Mail server infrastructure, MX records, SPF/DMARC, and email domain decomposition"
    default_providers: ["native_dns", "spiderfoot"]
    input_types: ["EMAIL", "DOMAIN"]
    output_types: ["DOMAIN", "HOSTNAME", "IP_ADDRESS"]

  CERTIFICATE_TRANSPARENCY:
    description: "Passive Certificate Transparency log enumeration"
    default_providers: ["native_ct"]
    input_types: ["DOMAIN"]
    output_types: ["HOSTNAME", "CERTIFICATE"]

  REGISTRY_LOOKUP:
    description: "RDAP and BGP routing registry lookups for IP, ASN, and Domain ownership"
    default_providers: ["native_rdap", "metabigor"]
    input_types: ["IP_ADDRESS", "ASN", "DOMAIN"]
    output_types: ["ASN", "CIDR", "ORGANIZATION"]

  SUBDOMAIN_DISCOVERY:
    description: "Passive discovery of domain subdomains and hosts"
    default_providers: ["subfinder", "native_ct", "native_dns"]
    input_types: ["DOMAIN"]
    output_types: ["HOSTNAME", "IP_ADDRESS"]

  INFRASTRUCTURE_DISCOVERY:
    description: "Network, ASN, IP range and hosting infrastructure discovery"
    default_providers: ["metabigor", "native_rdap"]
    input_types: ["DOMAIN", "IP_ADDRESS", "ASN", "ORGANIZATION"]
    output_types: ["IP_ADDRESS", "CIDR", "ASN", "ORGANIZATION"]

  BROAD_OSINT:
    description: "Comprehensive multi-source OSINT discovery"
    default_providers: ["spiderfoot"]
    input_types: ["DOMAIN", "IP_ADDRESS", "EMAIL", "PHONE", "USERNAME", "ORGANIZATION"]
    output_types: ["DOMAIN", "HOSTNAME", "IP_ADDRESS", "EMAIL", "PHONE", "USERNAME", "ACCOUNT", "CERTIFICATE", "ASN"]

  USERNAME_DISCOVERY:
    description: "Social media, code repositories, and account enumeration by username"
    default_providers: ["maigret"]
    input_types: ["USERNAME"]
    output_types: ["ACCOUNT", "URL"]

  BROWSER_PERSONAL_DISCOVERY:
    description: "Explicit, visible browser-assisted discovery using the signed-in Cốc Cốc profile"
    default_providers: ["coccoc_browser"]
    input_types: ["EMAIL", "USERNAME"]
    output_types: ["ACCOUNT", "URL"]

  INTERNET_INTELLIGENCE:
    description: "Internet-wide search engine and asset discovery"
    default_providers: ["uncover"]
    input_types: ["DOMAIN", "IP_ADDRESS", "ORGANIZATION"]
    output_types: ["IP_ADDRESS", "HOSTNAME", "URL", "CERTIFICATE"]

  IP_ENRICHMENT:
    description: "Credentialed IP geolocation, ISP, ASN, and proxy classification with source-level evidence"
    default_providers: ["whatismyip"]
    input_types: ["IP_ADDRESS", "IPV6_ADDRESS"]
    output_types: ["IP_ADDRESS", "IPV6_ADDRESS", "ASN", "ORGANIZATION"]
